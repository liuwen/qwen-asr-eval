[project]
name = "fishaudio-s2-pro-helper"
version = "0.1.0"
description = "Colab-first helper package for Fish Audio S2 Pro experiments."
requires-python = ">=3.12,<3.13"
dependencies = [
  "requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]
